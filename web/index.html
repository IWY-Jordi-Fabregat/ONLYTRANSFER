<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OnlyTransfer - Gestió Logística de Luxe">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OnlyTransfer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OnlyTransfer - Torre de Control</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Pantalla de càrrega neta i minimalista */
    body {
      background-color: #FFFFFF;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #F3F3F3;
      border-top: 3px solid #FF700A; /* El teu taronja corporatiu */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    .loading-text {
      color: #2D3142;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 14px;
      text-transform: uppercase;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <div class="loading-text">OnlyTransfer</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Forçar la neteja del Service Worker si hi ha canvis crítics
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            registration.update();
          }
        });
      });
    }
  </script>
</body>
</html>
